name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    name: ${{ matrix.os }} / sanitizers=${{ matrix.sanitize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install independent test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Configure
        run: cmake -S tests -B build_unit -DCMAKE_BUILD_TYPE=Release -DMESSAGEPACK_SANITIZE=${{ matrix.sanitize }}
      - name: Build codec and test runners
        run: cmake --build build_unit --parallel 4
      - name: Test supported MessagePack formats and Lua API
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: ${{ runner.os == 'macOS' && 'detect_leaks=0' || 'detect_leaks=1' }}
        run: ctest --test-dir build_unit --output-on-failure

  engine:
    name: Bob native extension and in-engine tests
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      DEFOLD_SHA1: ee283d4dad9fa451dd6399d83602e1dc25133681 # Defold 1.14.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Download official Bob
        run: curl --fail --location --retry 3 "https://d.defold.com/archive/${DEFOLD_SHA1}/bob/bob.jar" --output "$RUNNER_TEMP/bob.jar"
      - name: Select host platform
        run: echo "MESSAGEPACK_PLATFORM=$(uname -m)-macos" >> "$GITHUB_ENV"
      - name: Build native extension with Bob
        run: java -jar "$RUNNER_TEMP/bob.jar" --platform "$MESSAGEPACK_PLATFORM" --architectures "$MESSAGEPACK_PLATFORM" --variant headless --binary-output build/engine resolve build
      - name: Run codec and specification tests in Defold
        shell: bash
        run: |
          engine="./build/engine/$(uname -m)-osx/dmengine"
          chmod +x "$engine"
          "$engine" --config=messagepack_tests.quit=1 build/default/game.projectc | tee "$RUNNER_TEMP/messagepack-engine.log"
          grep -F "MessagePack unit tests complete" "$RUNNER_TEMP/messagepack-engine.log"
